spring:
  application:
    name: server

server:
  # Render tells the server which port to use in PORT. On your computer it's 8080.
  port: ${PORT:8080}

# How many explanations a day. Counted in memory and reset at midnight Israel time.
limits:
  per-device: 10
  per-ip: 30
  total: 500
  # Where the real client address comes from. Render sits behind Cloudflare, so the server itself
  # sees a Cloudflare address. Checked on Render: Cloudflare writes CF-Connecting-IP itself and refuses
  # requests that try to send it, while X-Forwarded-For can be faked by the client.
  # Without the header (on your computer), the connection's own address is used.
  client-ip-header: CF-Connecting-IP

# Who writes the explanations: "fake" (no AI, the default) or "gemini".
# To use Gemini, set EXPLAIN_PROVIDER=gemini in the run configuration. Tests always use "fake".
explain:
  provider: fake

gemini:
  # Comes only from the environment variable. Never write the key in this file.
  api-key: ${GEMINI_API_KEY:}
  # Tried in order. If one is busy (503 or 429) or too slow, the next one is tried.
  models: gemini-3.5-flash-lite, gemini-3.8-flash, gemini-3.1-flash-lite
